      if (["modify", "replace", "str_replace", "edit_file", "apply_patch"].includes(lower)) return "edit";
      if (["create", "save", "create_file", "write_file"].includes(lower)) return "write";
      return lower;
    }

    function bashCommandFromArgs(args) {
      if (!args || typeof args !== "object") return "";
      return String(args.command ?? args.cmd ?? args.script ?? "");
    }

    function argValue(args, names) {
      if (!args || typeof args !== "object") return "";
      for (const name of names) {
        if (args[name] !== undefined && args[name] !== null) return String(args[name]);
      }
      return "";
    }

    function pathFromArgs(args) {
      return argValue(args, ["path", "file_path", "filepath", "file", "target_file", "filename"]);
    }

    function writeContentFromArgs(args) {
      return argValue(args, [
        "content",
        "text",
        "data",
        "new_content",
        "newContent",
        "file_content",
        "fileContent",
        "contents",
        "body",
        "value"
      ]);
    }

    function readRangeFromArgs(args) {
      const start = argValue(args, ["start", "start_line", "line_start", "offset"]);
      const end = argValue(args, ["end", "end_line", "line_end", "limit"]);
      if (start && end) return `${start}-${end}`;
      return start || end || "";
    }

    function editItemsFromArgs(args) {
      if (!args || typeof args !== "object") return [];
      if (Array.isArray(args.edits)) return args.edits;
      if (Array.isArray(args.replacements)) return args.replacements;
      return [args];
    }

    function editTextPair(item) {
      return {
        oldText: argValue(item, ["old_string", "old_str", "oldText", "old_text", "old", "find", "search"]),
        newText: argValue(item, ["new_string", "new_str", "newText", "new_text", "new", "replace", "replacement"])
      };
    }

    function editLocationFromArgs(args) {
      const start = argValue(args, ["start", "start_line", "line_start"]);
      const end = argValue(args, ["end", "end_line", "line_end"]);
      if (start && end) return `${start}-${end}`;
      return start || end || "";
    }

    function renderGitHubDiff(edits, path = "") {
      const rows = [];
      const fileLabel = path || "file";
      let oldLine = 1;
      let newLine = 1;
      rows.push(`<tr class="ghDiffMeta"><td colspan="4">${escapeHtml(fileLabel)}</td></tr>`);
      for (const edit of edits) {
        rows.push(`<tr class="ghDiffMeta"><td colspan="4">@@ replace @@</td></tr>`);
        for (const line of splitCodeLines(edit.oldText || "")) {
          if (!edit.oldText && line === "") continue;
          rows.push(`<tr class="ghDiffDel"><td class="ghDiffNum">${oldLine++}</td><td class="ghDiffNum"></td><td class="ghDiffMark">-</td><td class="ghDiffCode">${escapeHtml(line)}</td></tr>`);
        }
        for (const line of splitCodeLines(edit.newText || "")) {
          if (!edit.newText && line === "") continue;
          rows.push(`<tr class="ghDiffAdd"><td class="ghDiffNum"></td><td class="ghDiffNum">${newLine++}</td><td class="ghDiffMark">+</td><td class="ghDiffCode">${escapeHtml(line)}</td></tr>`);
        }
      }
      return `<div class="ghDiff"><table><tbody>${rows.join("")}</tbody></table></div>`;
    }

    function renderGitHubSplitDiff(edits, path = "") {
      const rows = [];
      const fileLabel = path || "file";
      rows.push(`<tr class="ghSplitMeta"><td colspan="6">${escapeHtml(fileLabel)}</td></tr>`);
      for (const edit of edits) {
        rows.push(`<tr class="ghSplitMeta"><td colspan="6">@@ replace @@</td></tr>`);
        const oldLines = edit.oldText ? splitCodeLines(edit.oldText) : [];
        const newLines = edit.newText ? splitCodeLines(edit.newText) : [];
        const max = Math.max(oldLines.length, newLines.length, 1);
        for (let i = 0; i < max; i++) {
          const hasOld = i < oldLines.length;
          const hasNew = i < newLines.length;
          rows.push(`
            <tr>
              <td class="ghSplitNum ghSplitDel">${hasOld ? i + 1 : ""}</td>
              <td class="ghSplitMark ghSplitDel">${hasOld ? "-" : ""}</td>
              <td class="ghSplitCode ghSplitDel">${hasOld ? escapeHtml(oldLines[i]) : ""}</td>
              <td class="ghSplitNum ghSplitAdd">${hasNew ? i + 1 : ""}</td>
              <td class="ghSplitMark ghSplitAdd">${hasNew ? "+" : ""}</td>
              <td class="ghSplitCode ghSplitAdd">${hasNew ? escapeHtml(newLines[i]) : ""}</td>
            </tr>
          `);
        }
      }
      return `<div class="ghSplit"><table><tbody>${rows.join("")}</tbody></table></div>`;
    }

    function renderToolMain(toolName, args) {
      if (toolName === "bash") {
        const command = bashCommandFromArgs(args);
        if (command) return codeBlockHtml(command, "bash");
      }
      if (toolName === "read") {
        const path = pathFromArgs(args);
        const range = readRangeFromArgs(args);
        return `<div class="toolSummary"><strong>read</strong>${path ? ` ${escapeHtml(path)}` : ""}${range ? `:${escapeHtml(range)}` : ""}</div>`;
      }
      if (toolName === "write") {
        const path = pathFromArgs(args);
        const content = writeContentFromArgs(args);
        if (content) {
          return `<div class="toolSummary"><strong>write</strong>${path ? ` ${escapeHtml(path)}` : ""}</div>${renderGitHubDiff([{ oldText: "", newText: content }], path)}`;
        }
      }
      if (toolName === "edit") {
        const path = pathFromArgs(args);
        const edits = editItemsFromArgs(args).map(editTextPair).filter(edit => edit.oldText || edit.newText);
        if (edits.length) {
          const loc = editLocationFromArgs(args);
          const count = edits.length > 1 ? ` (${edits.length} edits)` : "";
          return `<div class="toolSummary"><strong>edit</strong>${path ? ` ${escapeHtml(path)}` : ""}${loc ? `:${escapeHtml(loc)}` : ""}${count}</div>${renderGitHubSplitDiff(edits, path)}`;
        }
      }
      return codeBlockHtml(JSON.stringify(args, null, 2), "json");
    }

    function renderToolResponse(message, toolName = "", args = {}) {
      if (!message) return "";
      const label = [
        message.name ? `name=${message.name}` : "",
        message.tool_call_id ? `tool_call_id=${message.tool_call_id}` : ""
      ].filter(Boolean).join("  ");
      const rawValue = message.raw_content ?? message.raw ?? null;
      const structured = structuredTextContent(rawValue ?? message.content);
      const shown = structured ? structured.text : displayText(message.content);
      const responseLang = toolName === "read"
        ? langFromPath(pathFromArgs(args))
        : (looksJson(shown) ? "json" : "text");
      const rawForDetails = rawValue ?? structured?.raw;
      const rawDetails = rawForDetails
        ? `<details class="toolCallRaw"><summary>raw response</summary>${codeBlockHtml(prettyJsonText(rawForDetails), "json")}</details>`
        : "";
      return `
        <div class="toolResponse">
          <div class="toolResponseHead">response${label ? ` | ${escapeHtml(label)}` : ""}</div>
          ${renderCodeOrMarkdown(shown, { markdown: false, forceCode: true, lang: responseLang })}
          ${rawDetails}
        </div>
      `;
    }

    function renderToolCalls(calls, pairedResponses = []) {
      if (!calls || !calls.length) return "";
      return calls.map((call, i) => {
        const rawToolName = toolNameFromCall(call);
        const toolName = canonicalToolName(rawToolName);
        const args = toolArgsFromCall(call);
        const main = renderToolMain(toolName, args);
        return `
          <div class="toolCall">
            <div class="toolCallHead">tool_call ${i + 1}: ${escapeHtml(rawToolName || toolName)}</div>
            ${main}
            <details class="toolCallRaw">
              <summary>raw</summary>
              ${codeBlockHtml(JSON.stringify(call, null, 2), "json")}
            </details>
            ${renderToolResponse(pairedResponses[i], toolName, args)}
          </div>
        `;
      }).join("");
    }

    function buildMessageViews(messages) {
      const consumed = new Set();
      const views = [];
      for (let index = 0; index < messages.length; index++) {
        const message = messages[index];
        if (!message || consumed.has(index)) continue;
        const responses = [];
        if (message.tool_calls?.length) {
          const nextToolIndexes = [];
          for (let j = index + 1; j < messages.length; j++) {
            const candidate = messages[j];
            if (candidate?.role !== "tool" || consumed.has(j)) break;
            nextToolIndexes.push(j);
          }
          message.tool_calls.forEach((call, callIndex) => {
            const callId = call.id || call.tool_call_id;
            let matchedIndex = -1;
            if (callId) {
              matchedIndex = nextToolIndexes.find(j => messages[j]?.tool_call_id === callId);
            }
            if (matchedIndex < 0 && nextToolIndexes[callIndex] !== undefined) {
              matchedIndex = nextToolIndexes[callIndex];
            }
            if (matchedIndex >= 0) {
              responses[callIndex] = messages[matchedIndex];
              consumed.add(matchedIndex);
            }
          });
        }
        views.push({ message, index, responses });
      }
      return views;
    }

    function mergeAdjacentAssistantViews(views) {
      const groups = [];
      for (const view of views) {
        const role = view.message?.role || "?";
        const previous = groups[groups.length - 1];
        if (role === "assistant" && previous?.role === "assistant") {
          previous.views.push(view);
        } else {
          groups.push({ role, views: [view] });
        }
      }
      return groups;
    }

    function extrasForMessage(message) {
      const extras = [];
      if (message.tool_calls) extras.push(`tool_calls=${message.tool_calls.length}`);
      if (message.name) extras.push(`name=${message.name}`);
      if (message.tool_call_id) extras.push(`tool_call_id=${message.tool_call_id}`);
      return extras;
    }

    function renderMessageChunk(view) {
      const { message, responses } = view;
      const role = message.role || "?";
      const forceCode = role === "tool";
      const markdown = role !== "tool";
      return `
        <div class="messageChunk">
          ${message.reasoning_content ? `<div class="reasoningBox">${escapeHtml(message.reasoning_content)}</div>` : ""}
          ${message.content ? renderCodeOrMarkdown(message.content, { markdown, forceCode }) : ""}
          ${renderToolCalls(message.tool_calls, responses)}
        </div>
      `;
    }

    function renderMessageGroup(group, displayIndex) {
      const first = group.views[0].message;
      const role = first.role || "?";
      const extras = group.views.flatMap(view => extrasForMessage(view.message));
      const uniqueExtras = Array.from(new Set(extras));
      return `
        <article class="message role-${escapeHtml(role)}">
          <div class="messageHead">
            <span>${displayIndex + 1}. ${escapeHtml(role.toUpperCase())}</span>
            <span class="sub">${escapeHtml(uniqueExtras.join("  "))}</span>
          </div>
          <div class="messageBody">
            ${group.views.map(renderMessageChunk).join("")}
          </div>
        </article>
      `;
    }

    function renderDetailLoading(entry) {
      state.pretextBlocks.clear();
      els.detailTitle.textContent = shortText(recordTitle(entry), 90);
      els.detailStatus.textContent = `${state.selectedFilteredIndex + 1}/${state.filtered.length} | loading detail`;
      els.detail.innerHTML = `<div class="empty">Loading record ${entry?.__lineNo || state.selectedFilteredIndex + 1}...</div>`;
    }

    function renderDetailError(entry, err) {
      state.pretextBlocks.clear();
      els.detailTitle.textContent = shortText(recordTitle(entry), 90);
      els.detailStatus.textContent = `${state.selectedFilteredIndex + 1}/${state.filtered.length} | detail error`;
      els.detail.innerHTML = `
        <div class="empty">Failed to load record ${entry?.__lineNo || state.selectedFilteredIndex + 1}: ${escapeHtml(err?.message || err)}</div>
        ${entry ? renderJsonDetails("record summary", entry.__summary || entry, true) : ""}
      `;
    }

    function renderDetail() {
      const row = state.selectedRow || currentRow();
      state.pretextBlocks.clear();
      if (!row) {
        els.detail.innerHTML = `<div class="empty">${state.records.length ? "No record selected." : "Load a GLM51 SFT JSONL or ATIF trajectory file with the file picker."}</div>`;
        els.detailTitle.textContent = "Record";
        els.detailStatus.textContent = state.records.length ? "No match" : "No file loaded";
        return;
      }
      if (row.__isSummary && state.loadMode === "jsonl-lazy") {
        renderDetailLoading(row);
        return;
      }
      const b = bm25(row);
      els.detailTitle.textContent = shortText(recordTitle(row), 90);
      els.detailStatus.textContent = `${state.selectedFilteredIndex + 1}/${state.filtered.length} | line ${row.__lineNo || "?"}`;
      const metaPreview = {
        format: row.meta?.format,
        schema_version: row.meta?.schema_version,
        session_id: row.meta?.session_id,
        bm25: {
          candidate_dataset: b.candidate_dataset,
          candidate_source: b.candidate_source,
          candidate_doc_id: b.candidate_doc_id,
          candidate_task_id: b.candidate_task_id,
          candidate_title: b.candidate_title,
          candidate_path: b.candidate_path,
          rank: b.rank,
          score: b.score
        },
        agent: row.meta?.agent,
        model: row.meta?.model,
        thinking: row.meta?.thinking,
        final_metrics: row.meta?.final_metrics,
        job: row.meta?.job,
        mode: row.meta?.mode,
        trial: row.meta?.trial,

      };
      const messageViews = buildMessageViews(row.messages || []);

      els.detail.innerHTML = `
        <div class="topMeta">
          <div class="kv"><div class="k">status</div><div class="v">${escapeHtml(row.meta?.status || "")}</div></div>
          <div class="kv"><div class="k">type</div><div class="v">${escapeHtml(isThinking(row) ? "thinking" : "instruct")}</div></div>
          <div class="kv"><div class="k">model</div><div class="v">${escapeHtml(providerModel(row))}</div></div>
          <div class="kv"><div class="k">original</div><div class="v">${escapeHtml(originalKey(row))}</div></div>
          <div class="kv"><div class="k">query</div><div class="v">${escapeHtml(b.query_task_name || row.meta?.task_name || "")}</div></div>
          <div class="kv"><div class="k">rank / score</div><div class="v">${escapeHtml(`${b.rank || ""} / ${b.score ?? ""}`)}</div></div>
        </div>
        ${renderTokenReport(row)}
        ${renderJsonDetails("meta", metaPreview, false)}
        ${renderJsonDetails("tools", row.tools || [], false)}
        ${messageGroups.map(renderMessageGroup).join("")}
      `;
      hydratePretextBlocks();
    }

    async function loadFile(file) {
      resetLoadedState();
      const token = state.loadToken;
      state.file = file;
      els.listStatus.textContent = "Loading...";
      els.detailStatus.textContent = "Loading...";
      els.detail.innerHTML = `<div class="empty">Loading ${escapeHtml(file.name || "file")}...</div>`;
      try {
        const isJsonl = /\.jsonl$/i.test(file.name || "");
        let result;
        if (isJsonl) {
          state.loadMode = "jsonl-lazy";
          els.listStatus.textContent = "Indexing...";
          result = await indexJsonlFile(file, token);
        } else {
          state.loadMode = "full";
          result = await loadJsonFile(file, token);
          result.rows.forEach((row, index) => addCache(rowKey(row, index + 1), row));
        }
        if (token !== state.loadToken) return;
        resetForRecords(result.rows, isJsonl ? "jsonl-lazy" : "full", file);
        els.detailStatus.textContent = result.errors.length ? `${result.errors.length} parse errors` : "Loaded";
        if (result.errors.length) console.warn("JSON/JSONL parse errors", result.errors.slice(0, 20));
      } catch (err) {
        if (token !== state.loadToken) return;
        state.records = [];
        state.filtered = [];
        els.listStatus.textContent = "Read failed";
        els.detailStatus.textContent = "Read failed";
        els.detail.innerHTML = `<div class="empty">Failed to load file: ${escapeHtml(err?.message || err)}</div>`;
        renderList();
      }
    }

    els.fileInput.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) loadFile(file);
    });
    els.searchInput.addEventListener("input", () => {
      state.selectedFilteredIndex = 0;
      applyFilters();
    });
    els.groupFilter.addEventListener("change", () => {
      state.selectedFilteredIndex = 0;
      applyFilters();
    });
    els.modelFilter.addEventListener("change", () => {
      state.selectedFilteredIndex = 0;
      applyFilters();
    });
    els.recordList.addEventListener("scroll", scheduleListRender);
    els.prevBtn.addEventListener("click", () => selectIndex(state.selectedFilteredIndex - 1));
    els.nextBtn.addEventListener("click", () => selectIndex(state.selectedFilteredIndex + 1));
    window.addEventListener("keydown", event => {
      if (event.target && ["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) return;
      if (event.key === "ArrowUp") selectIndex(state.selectedFilteredIndex - 1);
      if (event.key === "ArrowDown") selectIndex(state.selectedFilteredIndex + 1);
      if (event.key === "PageUp") selectIndex(state.selectedFilteredIndex - 10);
      if (event.key === "PageDown") selectIndex(state.selectedFilteredIndex + 10);
    });
    window.addEventListener("resize", () => {
      scheduleListRender();
      schedulePretextLayout();
    });
    if (document.fonts?.ready) {
      document.fonts.ready.then(schedulePretextLayout).catch(() => {});
    }

    loadPretext();
    renderList();
    renderDetail();
  </script>
</body>
</html>
